name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database API
        run: |
          curl -i -X GET "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/items?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
